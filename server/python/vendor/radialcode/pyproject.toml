[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radialcode"
version = "0.1.0a6"
description = "Open radial color 2D code reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "RadialCode contributors"}]
keywords = ["barcode", "2d-code", "computer-vision", "error-correction", "color"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "CairoSVG>=2.7",
  "reedsolo>=1.7.0",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.8"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6"]

[project.scripts]
radialcode-generate = "radialcode.cli:generate_main"
radialcode-decode = "radialcode.cli:decode_main"
radialcode-inspect = "radialcode.cli:inspect_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["radialcode"]
branch = true
